<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Bike Rental</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="/bikes" class="nav-link">Request or Rent</a>
            <a href="/bookings" class="nav-link">My Bookings</a>
            <a href="/feedback" class="nav-link">Feedback</a>
            <a th:if="${user.admin}" href="/maintenance" class="nav-link">Maintenance</a>
            <a href="/profile" class="nav-link active">My Profile</a>
        </div>
        <div class="nav-right">
            <a href="/logout" class="nav-link">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Edit Profile</h1>

        <form th:action="@{/profile/update}" method="post" th:object="${user}">
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{admin}" />
            
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" th:field="*{username}" required />
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" th:field="*{password}" required />
                <small class="form-text">Leave unchanged to keep your current password</small>
            </div>
            
            <div class="form-group">
                <label for="address">Address:</label>
                <input type="text" id="address" th:field="*{address}" required />
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="/profile" class="btn" style="background-color: #555;">Cancel</a>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; 2023 Bike Rental System</p>
    </footer>
</body>
</html>
