<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Request a Ride</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <h1>Request a Ride</h1>
    <div class="container">
        <form th:action="@{/bookings/request/{bikeId}(bikeId=${bike.id})}" method="post">
            <div class="form-group">
                <label for="address">Delivery Address:</label>
                <input type="text" id="address" name="address" th:value="${address}" required>
            </div>
            <div class="form-group">
                <h3>Bike Details</h3>
                <p><strong>Name:</strong> <span th:text="${bike.name}"></span></p>
                <p><strong>Type:</strong> <span th:text="${bike.type}"></span></p>
                <p><strong>Price per hour:</strong> $<span th:text="${bike.pricePerHour}"></span></p>
            </div>
            <button type="submit" class="btn">Request Bike Delivery</button>
        </form>
    </div>
</body>
</html>
